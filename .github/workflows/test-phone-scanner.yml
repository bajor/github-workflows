name: Phone scanner regression
on:
  pull_request:
    paths:
      - .github/workflows/secret-scanning.yml
      - .github/workflows/test-phone-scanner.yml
      - tests/test_phone_scanner.py
  push:
    branches: [main]
    paths:
      - .github/workflows/secret-scanning.yml
      - .github/workflows/test-phone-scanner.yml
      - tests/test_phone_scanner.py
permissions:
  contents: read
jobs:
  phone-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B -m unittest discover -s tests -p test_phone_scanner.py
