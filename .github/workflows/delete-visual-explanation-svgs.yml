name: Delete Visual Explanation SVGs

on:
  workflow_call:
    inputs:
      delete-raccoon-artifacts:
        description: Delete merged Raccoon PR folders and empty their catalog on main.
        type: boolean
        default: false
    secrets:
      # Required caller setup:
      # 1. Create a fine-grained PAT owned by a GitHub user.
      # 2. Give the PAT access to the caller repository.
      # 3. Give the PAT repository permission: Contents: Read and write.
      # 4. Add the PAT owner, not github-actions[bot], to the caller repository's
      #    main-branch ruleset bypass list if that ruleset blocks direct pushes.
      # 5. Store the PAT in the caller repository as an Actions secret named
      #    REMOVE_VISUALS_MAIN and pass it to this reusable workflow.
      REMOVE_VISUALS_MAIN:
        required: true
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  delete-visual-explanation-svgs:
    name: Delete merged visual explanation SVGs
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: generated-artifact-cleanup-${{ github.repository }}-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REMOVE_VISUALS_MAIN || github.token }}
          ref: main

      - name: Clean generated material
        uses: bajor/github-workflows/.github/actions/cleanup-generated@main
        with:
          delete-raccoon-artifacts: ${{ inputs.delete-raccoon-artifacts || false }}

      - name: Commit deletion if needed
        run: |
          if git diff --cached --quiet; then
            echo "No generated artifact changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove merged generated artifacts"
          git push origin HEAD:main
