name: Python Mutation Testing

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used to run the tests.
        required: false
        type: string
        default: "3.12"
      working-directory:
        description: Directory containing the Python project.
        required: false
        type: string
        default: .
      install-command:
        description: Trusted shell command that installs the project and its test dependencies.
        required: false
        type: string
        default: python -m pip install -e ".[test]"

permissions:
  contents: read

jobs:
  mutation-testing:
    name: Detect Surviving Mutations
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        id: install
        working-directory: ${{ inputs.working-directory }}
        run: |
          ${{ inputs.install-command }}
          python -m pip install "mutmut==3.6.0"

      - name: Run mutation tests
        working-directory: ${{ inputs.working-directory }}
        run: mutmut run

      - name: Report mutation results
        if: ${{ always() && steps.install.outcome == 'success' }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -uo pipefail

          results_file="$RUNNER_TEMP/mutmut-results.txt"
          survivors_file="$RUNNER_TEMP/mutmut-survivors.txt"
          incomplete_file="$RUNNER_TEMP/mutmut-incomplete.txt"

          if ! mutmut results --all true | tee "$results_file"; then
            echo "::error::Could not read mutmut results."
            exit 1
          fi

          if [ ! -s "$results_file" ]; then
            {
              echo "## Python mutation testing"
              echo
              echo "No mutants were generated. Check the mutmut configuration."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No mutants were generated. Check the mutmut configuration."
            exit 1
          fi

          grep ': survived$' "$results_file" | sed 's/^[[:space:]]*//' > "$survivors_file" || true
          grep -Ev ': (killed|caught by type check|survived)$' "$results_file" | sed 's/^[[:space:]]*//' > "$incomplete_file" || true

          {
            echo "## Python mutation testing"
            echo
            if [ -s "$survivors_file" ]; then
              echo "### Survived mutants"
              echo
              echo "The tests still passed after these code changes:"
              echo
              echo '```text'
              cat "$survivors_file"
              echo '```'
              echo
            fi
            if [ -s "$incomplete_file" ]; then
              echo "### Mutants without a conclusive result"
              echo
              echo '```text'
              cat "$incomplete_file"
              echo '```'
              echo
            fi
            if [ ! -s "$survivors_file" ] && [ ! -s "$incomplete_file" ]; then
              echo "All tested mutations were detected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r result; do
            mutant="${result%: survived}"
            echo "::error title=Survived mutant::$mutant"
            echo "::group::Tests and code change for $mutant"
            echo "Tests that passed for this mutant:"
            mutmut tests-for-mutant "$mutant"
            echo
            echo "Code change not detected by the tests:"
            mutmut show "$mutant"
            echo "::endgroup::"
          done < "$survivors_file"

          if [ -s "$incomplete_file" ]; then
            echo "::error::Some mutants did not produce a conclusive result."
          fi

          if [ -s "$survivors_file" ] || [ -s "$incomplete_file" ]; then
            exit 1
          fi
