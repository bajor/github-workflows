name: Python PyPI Publish

# Requirements:
# - This workflow publishes to real PyPI only.
# - Configure PyPI Trusted Publishing for the calling repository before use.
# - Run this workflow after the reusable release workflow, because release tagging
#   and changelog version extraction are owned by that workflow.
# - The latest CHANGELOG.md version must match VERSION before publishing.

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used to build the package.
        required: false
        type: string
        default: "3.12"
      working-directory:
        description: Directory containing the Python package.
        required: false
        type: string
        default: .

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Verify release version
        working-directory: ${{ inputs.working-directory }}
        run: |
          changelog_version=$(grep -m1 '^## \[' CHANGELOG.md | sed 's/^## \[\([0-9][0-9.]*\)\].*/\1/')
          if [ -z "$changelog_version" ]; then
            echo "::error::Could not extract version from CHANGELOG.md"
            exit 1
          fi

          version=$(tr -d '[:space:]' < VERSION)
          if [ -z "$version" ]; then
            echo "::error::VERSION is empty"
            exit 1
          fi

          if [ "$changelog_version" != "$version" ]; then
            echo "::error::CHANGELOG.md version $changelog_version does not match VERSION $version"
            exit 1
          fi

          echo "Publishing version $version to PyPI."

      - name: Install build dependencies
        run: python -m pip install "build==1.3.0"

      - name: Build package
        working-directory: ${{ inputs.working-directory }}
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598 # v1.13.0
        with:
          packages-dir: ${{ inputs.working-directory }}/dist
